<div class="container">
    <h1>MiniApp SDK - Angular Demo</h1>

    <!-- Lifecycle -->
    <section>
        <h3 class="section-title">Lifecycle</h3>
        <div class="btn-group">
            <button class="btn" (click)="onReady()">ready()</button>
        </div>
    </section>

    <!-- Input -->
    <section>
        <h3 class="section-title">Input</h3>
        <div class="btn-group">
            <input type="text" placeholder="Type something..." [(ngModel)]="inputValue" />
        </div>
    </section>

    <!-- Storage -->
    <section>
        <h3 class="section-title">Storage API</h3>
        <div class="btn-group">
            <button class="btn" (click)="run('storage.set', storageSet)">storage.set</button>
            <button class="btn" (click)="run('storage.get', storageGet)">storage.get</button>
            <button class="btn" (click)="run('storage.remove', storageRemove)">storage.remove</button>
            <button class="btn" (click)="run('storage.clear', storageClear)">storage.clear</button>
            <button class="btn" (click)="run('storage.info', storageInfo)">storage.info</button>
        </div>
    </section>

    <!-- UI -->
    <section>
        <h3 class="section-title">UI API</h3>
        <div class="btn-group">
            <button class="btn" (click)="run('showToast', showToast)">showToast</button>
            <button class="btn" (click)="run('showLoading', showLoading)">showLoading</button>
            <button class="btn" (click)="run('hideLoading', hideLoading)">hideLoading</button>
            <button class="btn" (click)="run('showDialog', showDialog)">showDialog</button>
            <button class="btn" (click)="run('showActionSheet', showActionSheet)">showActionSheet</button>
        </div>
    </section>

    <!-- Navigator -->
    <section>
        <h3 class="section-title">Navigator API</h3>
        <div class="btn-group">
            <button class="btn" (click)="run('navigator.push', navPush)">push /detail</button>
            <button class="btn" (click)="run('navigator.pop', navPop)">pop</button>
            <button class="btn" (click)="run('navigator.redirect', navRedirect)">redirect /home</button>
            <button class="btn" (click)="run('navigator.switchTab', navSwitchTab)">switchTab</button>
        </div>
    </section>

    <!-- Data APIs -->
    <section>
        <h3 class="section-title">Data APIs</h3>
        <div class="btn-group">
            <button class="btn" (click)="run('getLocation', fnGetLocation)">getLocation</button>
            <button class="btn" (click)="run('getContacts', fnGetContacts)">getContacts</button>
            <button class="btn" (click)="run('getMultipleUserData', fnGetUserData)">getMultipleUserData</button>
            <button class="btn" (click)="run('getLocalAuthStatus', fnGetLocalAuth)">getLocalAuthStatus</button>
        </div>
    </section>

    <!-- Request Permissions -->
    <section>
        <h3 class="section-title">Request Permissions</h3>
        <div class="btn-group">
            <button class="btn" (click)="run('requestCamera', fnReqCamera)">Camera</button>
            <button class="btn" (click)="run('requestLocation', fnReqLocation)">Location</button>
            <button class="btn" (click)="run('requestPhotos', fnReqPhotos)">Photos</button>
            <button class="btn" (click)="run('requestContacts', fnReqContacts)">Contacts</button>
            <button class="btn" (click)="run('requestLogin', fnReqLogin)">Login</button>
            <button class="btn" (click)="run('requestPayment', fnReqPayment)">Payment</button>
        </div>
    </section>

    <!-- Check Permissions -->
    <section>
        <h3 class="section-title">Check Permissions</h3>
        <div class="btn-group">
            <button class="btn" (click)="run('checkCamera', fnChkCamera)">Camera</button>
            <button class="btn" (click)="run('checkLocation', fnChkLocation)">Location</button>
            <button class="btn" (click)="run('checkLogin', fnChkLogin)">Login</button>
            <button class="btn" (click)="run('clearCache', fnClearCache)">clearCache</button>
        </div>
    </section>

    <!-- Navigation APIs -->
    <section>
        <h3 class="section-title">Navigation APIs</h3>
        <div class="btn-group">
            <button class="btn" (click)="run('appOpenWebview', fnOpenWebview)">appOpenWebview</button>
            <button class="btn" (click)="run('openExternalLink', fnOpenExtLink)">openExternalLink</button>
            <button class="btn" (click)="run('exit', fnExit)">exit</button>
        </div>
    </section>

    <!-- UI Customization -->
    <section>
        <h3 class="section-title">UI Customization</h3>
        <div class="btn-group">
            <button class="btn" (click)="run('statusBarColor', fnStatusBarColor)">StatusBar Color</button>
            <button class="btn" (click)="run('navBarColor', fnNavBarColor)">NavBar Color</button>
            <button class="btn" (click)="run('statusBarDark', fnStatusBarDark)">StatusBar Dark</button>
            <button class="btn" (click)="run('navBarLight', fnNavBarLight)">NavBar Light</button>
        </div>
    </section>

    <!-- Other APIs -->
    <section>
        <h3 class="section-title">Other APIs</h3>
        <div class="btn-group">
            <button class="btn" (click)="run('shareText', fnShareText)">shareText</button>
            <button class="btn" (click)="run('pickFile', fnPickFile)">pickFile</button>
        </div>
    </section>

    <!-- Logs -->
    <div style="margin-top: 16px">
        <div style="display: flex; justify-content: space-between; align-items: center">
            <h3 style="margin: 0">Logs</h3>
            <button class="btn" (click)="logs = []">Clear</button>
        </div>
        <pre class="log-area">{{ logs.length ? logs.join('\\n') : 'No logs yet. Click a button above.' }}</pre>
    </div>
</div>
